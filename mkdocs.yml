site_name: 数据科学与数字人文
site_url: https://sghpedc5279.github.io/dsdh/
repo_url: https://github.com/sghpedc5279/dsdh
site_description: 可复现、案例真实、伦理在场的数字教材

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

nav:
  - 首页: index.md
  - 模块一: 模块一.md
  - 数字教材: 教材/index.html
  - 课堂游戏: games.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
