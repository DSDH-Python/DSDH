<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">AI辅助科研的闭环及研究者把关点</title>
  <desc id="desc">模型协助提出候选问题、检索证据、运行可复现分析和生成解释；研究者在问题、数据权限、实验有效性和结论发布环节负责审查。</desc>
  <rect width="760" height="310" rx="8" fill="#fff"/>
  <text x="380" y="30" text-anchor="middle" fill="#243246" font-family="Arial, sans-serif" font-size="16" font-weight="700">AI 辅助科研：自动化步骤必须嵌入可审计的研究闭环</text>
  <g fill="#e8f2ef" stroke="#b7d4ce" stroke-width="1.5" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="49" y="86" width="142" height="62" rx="10"/><rect x="222" y="86" width="142" height="62" rx="10"/>
    <rect x="395" y="86" width="142" height="62" rx="10"/><rect x="568" y="86" width="142" height="62" rx="10"/>
  </g>
  <g fill="#243246" font-family="Arial, sans-serif" text-anchor="middle" font-size="14">
    <text x="120" y="113">提出候选问题</text><text x="120" y="133" font-size="11">人确定研究价值</text>
    <text x="293" y="113">检索与整理资料</text><text x="293" y="133" font-size="11">核验来源与许可</text>
    <text x="466" y="113">运行分析 / 实验</text><text x="466" y="133" font-size="11">记录代码与参数</text>
    <text x="639" y="113">解释与报告</text><text x="639" y="133" font-size="11">人审结论与责任</text>
  </g>
  <g stroke="#68778a" stroke-width="2"><path d="M193 117h25 M366 117h25 M539 117h25"/><path d="M639 158v64H121v-64"/></g>
  <g fill="#68778a"><path d="M214 112l9 5-9 5z"/><path d="M387 112l9 5-9 5z"/><path d="M560 112l9 5-9 5z"/><path d="M116 226l5 9 5-9z"/></g>
  <rect x="255" y="216" width="250" height="43" rx="20" fill="#fff3e9" stroke="#edceb6"/>
  <text x="380" y="243" text-anchor="middle" fill="#8a5a3c" font-family="Arial, sans-serif" font-size="13">研究者：授权、复核、复现、承担责任</text>
  <text x="380" y="289" text-anchor="middle" fill="#647184" font-family="Arial, sans-serif" font-size="11">概念框架；模型生成的假设或结果仍需独立验证</text>
</svg>
