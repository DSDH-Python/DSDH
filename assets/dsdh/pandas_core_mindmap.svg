<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">pandas 核心知识点思维导图</title>
  <desc id="description">以 DataFrame 和 Series 为中心，梳理数据对象、读写、选择筛选、清洗变换、分组统计、表格合并与结果核验六类 pandas 核心知识。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { fill: #243246; font-size: 40px; font-weight: 700; }
      .subtitle { fill: #647184; font-size: 21px; }
      .node-title { fill: #176B66; font-size: 24px; font-weight: 700; }
      .node-body { fill: #526174; font-size: 18px; }
      .center-title { fill: #FFFFFF; font-size: 34px; font-weight: 700; }
      .center-body { fill: #E5F2EF; font-size: 18px; }
      .footer { fill: #526174; font-size: 18px; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#F8F7F2"/>
  <rect x="42" y="36" width="1516" height="888" rx="22" fill="#FFFFFF" stroke="#D9E0E5" stroke-width="2"/>
  <rect x="42" y="36" width="18" height="888" rx="9" fill="#176B66"/>
  <text x="96" y="100" class="title">pandas 核心知识点思维导图</text>
  <text x="98" y="142" class="subtitle">围绕表格数据，从读入材料到核验并导出可复现结果</text>

  <g fill="none" stroke="#A9C9C3" stroke-width="4" stroke-linecap="round">
    <path d="M618 374 C580 340 562 302 524 286"/>
    <path d="M618 466 C578 466 563 466 524 466"/>
    <path d="M618 558 C580 595 563 635 524 646"/>
    <path d="M982 374 C1020 340 1038 302 1076 286"/>
    <path d="M982 466 C1022 466 1037 466 1076 466"/>
    <path d="M982 558 C1020 595 1037 635 1076 646"/>
  </g>

  <g>
    <rect x="96" y="206" width="430" height="156" rx="16" fill="#E5F2EF" stroke="#C9DDD8" stroke-width="2"/>
    <circle cx="128" cy="244" r="8" fill="#176B66"/>
    <text x="150" y="253" class="node-title">数据对象与类型</text>
    <text x="124" y="294" class="node-body">Series：一维带索引数据</text>
    <text x="124" y="326" class="node-body">DataFrame：二维表 · 行、列与类型</text>
  </g>

  <g>
    <rect x="96" y="386" width="430" height="156" rx="16" fill="#F5F6F3" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="128" cy="424" r="8" fill="#D8754F"/>
    <text x="150" y="433" class="node-title">读取与写出</text>
    <text x="124" y="474" class="node-body">read_csv · read_excel</text>
    <text x="124" y="506" class="node-body">to_csv · to_excel · 检查编码与来源</text>
  </g>

  <g>
    <rect x="96" y="566" width="430" height="156" rx="16" fill="#E5F2EF" stroke="#C9DDD8" stroke-width="2"/>
    <circle cx="128" cy="604" r="8" fill="#176B66"/>
    <text x="150" y="613" class="node-title">选择、筛选与排序</text>
    <text x="124" y="654" class="node-body">loc 按标签 · iloc 按位置</text>
    <text x="124" y="686" class="node-body">布尔条件 · query · sort_values</text>
  </g>

  <g>
    <rect x="1074" y="206" width="430" height="156" rx="16" fill="#F5F6F3" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="1106" cy="244" r="8" fill="#D8754F"/>
    <text x="1128" y="253" class="node-title">清洗与变换</text>
    <text x="1102" y="294" class="node-body">isna · dropna · drop_duplicates</text>
    <text x="1102" y="326" class="node-body">astype · fillna（依据含义审慎处理）</text>
  </g>

  <g>
    <rect x="1074" y="386" width="430" height="156" rx="16" fill="#E5F2EF" stroke="#C9DDD8" stroke-width="2"/>
    <circle cx="1106" cy="424" r="8" fill="#176B66"/>
    <text x="1128" y="433" class="node-title">分组与统计</text>
    <text x="1102" y="474" class="node-body">groupby · agg · size / count</text>
    <text x="1102" y="506" class="node-body">pivot_table · 说明统计口径</text>
  </g>

  <g>
    <rect x="1074" y="566" width="430" height="156" rx="16" fill="#F5F6F3" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="1106" cy="604" r="8" fill="#D8754F"/>
    <text x="1128" y="613" class="node-title">合并、核验与复现</text>
    <text x="1102" y="654" class="node-body">merge · concat · 检查未匹配记录</text>
    <text x="1102" y="686" class="node-body">核对行数与字段 · 记录步骤 · 导出</text>
  </g>

  <g>
    <rect x="618" y="362" width="364" height="208" rx="24" fill="#176B66"/>
    <text x="800" y="440" text-anchor="middle" class="center-title">pandas</text>
    <path d="M704 462H896" stroke="#6FA49D" stroke-width="2"/>
    <text x="800" y="504" text-anchor="middle" class="center-body">Series + DataFrame</text>
    <text x="800" y="534" text-anchor="middle" class="center-body">表格数据分析工具</text>
  </g>

  <rect x="96" y="780" width="1408" height="86" rx="14" fill="#F5F4EF" stroke="#E4E1D8" stroke-width="2"/>
  <text x="126" y="816" class="node-title">常用工作流</text>
  <text x="126" y="846" class="footer">读入 → 检查 → 选择 / 清洗 → 变换 / 统计 → 核验 → 导出；每步保留来源、口径与处理记录。</text>
</svg>
