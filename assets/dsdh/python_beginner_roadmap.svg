<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Python 入门经典学习路线图</title>
  <desc id="description">从运行环境和基础语法开始，依次学习数据结构与函数、调试和小项目，再进入 pandas 数据分析；面向对象、算法和其他应用方向可按需拓展。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#D8754F" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { fill: #243246; font-size: 42px; font-weight: 700; }
      .subtitle { fill: #647184; font-size: 23px; }
      .step { fill: #176B66; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .heading { fill: #243246; font-size: 25px; font-weight: 700; }
      .body { fill: #526174; font-size: 19px; }
      .result { fill: #176B66; font-size: 17px; font-weight: 700; }
      .note { fill: #647184; font-size: 18px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F8F7F2"/>
  <rect x="48" y="42" width="1504" height="816" rx="22" fill="#FFFFFF" stroke="#D9E0E5" stroke-width="2"/>
  <rect x="48" y="42" width="18" height="816" rx="9" fill="#176B66"/>
  <text x="104" y="105" class="step">PYTHON · BEGINNER ROADMAP</text>
  <text x="104" y="165" class="title">Python 入门经典学习路线图</text>
  <text x="106" y="211" class="subtitle">从“能运行第一段代码”，到“能用数据回答一个真实问题”</text>

  <g fill="none" stroke="#D8754F" stroke-width="3" marker-end="url(#arrow)">
    <path d="M365 426H390"/>
    <path d="M659 426H684"/>
    <path d="M953 426H978"/>
    <path d="M1247 426H1272"/>
  </g>

  <g>
    <rect x="98" y="282" width="267" height="296" rx="16" fill="#E5F2EF" stroke="#176B66" stroke-width="2"/>
    <circle cx="132" cy="320" r="18" fill="#176B66"/>
    <text x="132" y="326" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">1</text>
    <text x="160" y="328" class="step">起步</text>
    <text x="122" y="383" class="heading">搭好环境</text>
    <text x="122" y="428" class="body">Python 与编辑器</text>
    <text x="122" y="460" class="body">运行、保存、再运行</text>
    <path d="M122 492H341" stroke="#C9DDD8" stroke-width="2"/>
    <text x="122" y="533" class="result">产出：Hello, Python!</text>
  </g>

  <g>
    <rect x="392" y="282" width="267" height="296" rx="16" fill="#F5F6F3" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="426" cy="320" r="18" fill="#D8754F"/>
    <text x="426" y="326" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">2</text>
    <text x="454" y="328" class="step">基础语法</text>
    <text x="416" y="383" class="heading">表达逻辑</text>
    <text x="416" y="428" class="body">变量、类型、运算</text>
    <text x="416" y="460" class="body">条件、循环、缩进</text>
    <path d="M416 492H635" stroke="#D9E0E5" stroke-width="2"/>
    <text x="416" y="533" class="result">产出：写出清晰步骤</text>
  </g>

  <g>
    <rect x="686" y="282" width="267" height="296" rx="16" fill="#E5F2EF" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="720" cy="320" r="18" fill="#176B66"/>
    <text x="720" y="326" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">3</text>
    <text x="748" y="328" class="step">组织与复用</text>
    <text x="710" y="383" class="heading">处理数据</text>
    <text x="710" y="428" class="body">字符串、列表、字典</text>
    <text x="710" y="460" class="body">函数、文件、异常</text>
    <path d="M710 492H929" stroke="#C9DDD8" stroke-width="2"/>
    <text x="710" y="533" class="result">产出：文本计数脚本</text>
  </g>

  <g>
    <rect x="980" y="282" width="267" height="296" rx="16" fill="#F5F6F3" stroke="#D9E0E5" stroke-width="2"/>
    <circle cx="1014" cy="320" r="18" fill="#D8754F"/>
    <text x="1014" y="326" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">4</text>
    <text x="1042" y="328" class="step">动手实践</text>
    <text x="1004" y="383" class="heading">调试与验证</text>
    <text x="1004" y="428" class="body">拆小问题，逐步实现</text>
    <text x="1004" y="460" class="body">读报错、检查结果</text>
    <path d="M1004 492H1223" stroke="#D9E0E5" stroke-width="2"/>
    <text x="1004" y="533" class="result">产出：独立小项目</text>
  </g>

  <g>
    <rect x="1274" y="282" width="267" height="296" rx="16" fill="#E5F2EF" stroke="#176B66" stroke-width="2"/>
    <circle cx="1308" cy="320" r="18" fill="#176B66"/>
    <text x="1308" y="326" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">5</text>
    <text x="1336" y="328" class="step">进入数据分析</text>
    <text x="1298" y="383" class="heading">学习 pandas</text>
    <text x="1298" y="428" class="body">读写表格、清洗数据</text>
    <text x="1298" y="460" class="body">筛选、分组、可视化</text>
    <path d="M1298 492H1517" stroke="#C9DDD8" stroke-width="2"/>
    <text x="1298" y="533" class="result">产出：可复现分析</text>
  </g>

  <rect x="98" y="624" width="1443" height="83" rx="14" fill="#F5F4EF" stroke="#E4E1D8" stroke-width="2"/>
  <text x="126" y="659" class="step">一路通用的学习方法</text>
  <text x="126" y="688" class="note">看一个概念 → 写一小段代码 → 运行并读懂结果 → 修改验证；遇到报错先定位、再缩小问题。</text>

  <text x="104" y="770" class="note">按需拓展：面向对象 · 算法与数据结构 · 自动化 / Web / AI</text>
  <text x="104" y="809" class="note">不必一开始学完所有方向；先把基础用在一个自己关心的问题上。</text>
</svg>
